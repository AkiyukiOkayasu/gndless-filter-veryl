[project]
name = "gndless_filter"
version = "0.3.0"
authors = ["Akiyuki Okayasu"]
description = "Shift-based first-order LPF/HPF filters (1:1 rate) for Veryl."
license = "MIT OR Apache-2.0"
repository = "https://github.com/AkiyukiOkayasu/gndless-filter-veryl"

[build]
sources = ["src"]
target = { type = "directory", path = "target" }

[test]

[dependencies]
# 未公開のローカル変更を利用するためpath指定。公開前にgithub依存へ戻す。
gndless_fixedpoint = { path = "../gndless-fixedpoint-veryl" }

[publish]
register = true
bump_commit = true
publish_commit = true
